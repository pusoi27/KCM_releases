<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="2" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stdytime is starting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --brand-primary: #2e7d32;
      --brand-primary-dark: #1b5e20;
      --brand-accent: #fdd835;
      --panel-shadow: 0 18px 42px rgba(0, 0, 0, 0.10);
    }
    html, body {
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(46, 125, 50, 0.08), transparent 35%),
        radial-gradient(circle at bottom right, rgba(253, 216, 53, 0.10), transparent 30%),
        linear-gradient(135deg, #f5f8f7 0%, #eef4f1 100%);
      color: #16311c;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .startup-shell {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .startup-card {
      width: 100%;
      max-width: 640px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(27, 94, 32, 0.08);
      border-radius: 22px;
      box-shadow: var(--panel-shadow);
      padding: 32px 28px;
      backdrop-filter: blur(8px);
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.18);
      background: #fff;
      flex-shrink: 0;
    }
    .brand-logo-fallback {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-dark));
      color: #fff;
      font-size: 1.6rem;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.18);
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 1.45rem;
      font-weight: 700;
      margin: 0;
    }
    .brand-subtitle {
      color: #4c6754;
      margin: 0;
      font-size: 0.98rem;
    }
    .status-panel {
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(46, 125, 50, 0.08), rgba(253, 216, 53, 0.10));
      border: 1px solid rgba(46, 125, 50, 0.10);
      padding: 18px 18px 16px;
    }
    .status-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .spinner-ring {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(46, 125, 50, 0.18);
      border-top-color: var(--brand-primary);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      flex-shrink: 0;
    }
    .status-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .status-copy {
      margin: 0;
      color: #3f5c48;
      line-height: 1.55;
    }
    .status-foot {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid rgba(46, 125, 50, 0.12);
      color: #31503a;
      font-size: 0.92rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--brand-primary);
      box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.45);
      animation: pulse 1.6s infinite;
    }
    .refresh-note {
      margin: 0;
      color: #5c7464;
      font-size: 0.9rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.45); }
      70% { box-shadow: 0 0 0 9px rgba(46, 125, 50, 0); }
      100% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
    }
  </style>
</head>
<body>
  <div class="startup-shell">
    <section class="startup-card" aria-live="polite" aria-busy="true">
      <div class="brand-row">
        <img
          class="brand-logo"
          src="{{ url_for('static', filename='img/logo.png') }}"
          alt="Stdytime"
          onerror="this.style.display='none';document.getElementById('startupLogoFallback').style.display='flex';"
        >
        <div id="startupLogoFallback" class="brand-logo-fallback">S</div>
        <div>
          <h1 class="brand-title">Stdytime</h1>
          <p class="brand-subtitle">Preparing your class dashboard and syncing startup essentials.</p>
        </div>
      </div>

      <div class="status-panel">
        <div class="status-head">
          <div class="spinner-ring" aria-hidden="true"></div>
          <div>
            <p class="status-title">Starting up…</p>
            <p class="status-copy">Wait while the configuration is completed and the app finishes its background startup tasks.</p>
          </div>
        </div>

        <div class="status-foot">
          <div class="status-chip">
            <span class="pulse-dot" aria-hidden="true"></span>
            <span>Loading local data and finalizing startup</span>
          </div>
          <p class="refresh-note">This page refreshes automatically.</p>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
