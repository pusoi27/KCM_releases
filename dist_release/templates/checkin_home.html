{% extends "base.html" %}

{% block title %} · Scanner Station{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 760px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-2"><i class="bi bi-upc-scan me-2"></i>Scanner Station</h1>
      <p class="text-muted mb-4">
        This station is optimized for fast scan workflows. Start scanning from here.
      </p>

      <div class="d-grid gap-2">
        <a class="btn btn-primary btn-lg" href="{{ url_for('qr_scanner') }}">
          <i class="bi bi-qr-code-scan me-2"></i>Start Scanner
        </a>
      </div>

      <p class="small text-muted mt-3 mb-0">
        Instructor View is hidden on Scanner Station setups.
      </p>
    </div>
  </div>
</div>
{% endblock %}
