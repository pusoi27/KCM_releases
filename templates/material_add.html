{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <div class="row mb-3">
    <div class="col-md-8">
      <h2><i class="bi bi-box-seam"></i> Add Device</h2>
    </div>
    <div class="col-md-4 text-end">
      <a href="{{ url_for('materials_list') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back to Devices List
      </a>
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form id="materialForm">
        <input type="hidden" id="materialId" name="materialId">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Device Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="titleInput" autofocus required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Description</label>
            <input type="text" class="form-control" id="authorInput">
          </div>
          <div class="col-md-6">
            <label class="form-label">Inventory Location</label>
            <input type="text" class="form-control" id="publisherInput">
          </div>
        </div>

        <div class="mt-4 d-flex gap-2">
          <button type="button" id="saveBtn" class="btn btn-success"><i class="bi bi-save"></i> Save</button>
          <button type="button" id="resetBtn" class="btn btn-outline-secondary">Clear</button>
        </div>
      </form>
    </div>
  </div>

  <div id="alertBox" class="alert d-none" role="alert"></div>
</div>

<script>
(function() {
  const alertBox = document.getElementById('alertBox');
  const saveBtn = document.getElementById('saveBtn');
  const resetBtn = document.getElementById('resetBtn');

  const editMaterialId = {{ edit_material_id if edit_material_id is not none else 'null' }};

  const materialIdEl = document.getElementById('materialId');
  const titleEl = document.getElementById('titleInput');
  const authorEl = document.getElementById('authorInput');
  const publisherEl = document.getElementById('publisherInput');

  if (editMaterialId) {
    loadMaterialForEdit(editMaterialId);
  }

  resetBtn.addEventListener('click', clearForm);

  saveBtn.addEventListener('click', async () => {
    if (!titleEl.value.trim()) {
      showAlert('Device Name is required.', 'danger');
      return;
    }

    const payload = {
      id: materialIdEl.value || null,
      title: titleEl.value.trim(),
      author: authorEl.value.trim(),
      publisher: publisherEl.value.trim(),
      copies: 1,
    };

    try {
      const resp = await fetch('/api/materials/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Save failed');
      showAlert(data.status === 'updated' ? 'Device updated.' : 'Device added. QR code generated.', 'success');
      clearForm();
    } catch (err) {
      showAlert(err.message, 'danger');
    }
  });

  async function loadMaterialForEdit(materialId) {
    try {
      const resp = await fetch(`/api/materials/${materialId}`);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Failed to load device');
      const material = data.material || {};

      materialIdEl.value = material.id || '';
      titleEl.value = material.title || '';
      authorEl.value = material.author || '';
      publisherEl.value = material.publisher || '';
      showAlert('Editing existing device. Update fields and click Save.', 'info');
    } catch (err) {
      showAlert(err.message, 'danger');
    }
  }

  function showAlert(msg, type = 'info') {
    if (!msg) {
      alertBox.classList.add('d-none');
      alertBox.textContent = '';
      return;
    }
    alertBox.className = 'alert alert-' + type;
    alertBox.textContent = msg;
    alertBox.classList.remove('d-none');
  }

  function clearForm() {
    materialIdEl.value = '';
    titleEl.value = '';
    authorEl.value = '';
    publisherEl.value = '';
    titleEl.focus();
  }
})();
</script>
{% endblock %}
