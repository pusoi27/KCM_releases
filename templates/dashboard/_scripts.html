<script>
const SEAT_LIMIT = 16;
const SEAT_LIMIT_FULLSCREEN = 16; // 4x4 grid = 16 seats
const IDLE_TIMEOUT_MS = 60000; // 1 minute
const isActiveClassWindow = true; // only dashboard should handle class check-in/out

let idleTimer = null;
let isFullscreenMode = false;
let lastActivityTime = Date.now();
let lastAssistantsSnapshot = [];
let dashboardRefreshToken = 0;
let activeSeatCards = new Map(); // student_id -> { card, timerId }
let overflowTimers = new Map(); // student_id -> timerId  (for students beyond SEAT_LIMIT)
let dashboardFetchInFlight = false;
let dashboardRefreshQueued = false;
let dashboardPollTimer = null;
let dashboardDataDegraded = false;
let dashboardDataDegradedReason = '';
let dashboardLastGoodSyncAt = 0;
const DASHBOARD_POLL_MS = 12000;
const CARD_TIMER_TICK_MS = 15000;
const IS_INSTRUCTOR_STATION = {{ 'true' if subscription_access and subscription_access.is_instructor_station else 'false' }};
const IS_READONLY_DASHBOARD = IS_INSTRUCTOR_STATION;
const CHECKED_EMAIL_STORAGE_KEY = `stdytime.checkedEmailSent.${new Date().toISOString().slice(0,10)}`;
const checkedEmailSentMap = new Map(); // student_id -> true when checkout confirmation email sent
let dashboardState = {
  students: [],
  sessions: [],
  assistants: [],
};

function pageIsReadyForScan(){
  return document.visibilityState === 'visible' && document.hasFocus();
}

function recordActivity(){
  lastActivityTime = Date.now();
  if(isFullscreenMode){
    exitFullscreenMode();
  }
  resetIdleTimer();
}

function resetIdleTimer(){
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(checkIdleState, IDLE_TIMEOUT_MS);
}

function checkIdleState(){
  if (IS_INSTRUCTOR_STATION) return;
  // Only enter fullscreen if there are active students
  const seatGrid = document.getElementById('seatGrid');
  if(!seatGrid) return;
  const activeCards = seatGrid.querySelectorAll('.seat-card');
  if(activeCards.length > 0 && !isFullscreenMode){
    enterFullscreenMode();
  }
}

function enterFullscreenMode(){
  isFullscreenMode = true;
  const col1 = document.getElementById('studentsCol');
  const col2 = document.getElementById('activeCol');
  const col3 = document.getElementById('checkedCol');
  
  if(col1) col1.style.display = 'none';
  if(col3) col3.style.display = 'none';
  if(col2){
    col2.classList.remove('col-lg-8', 'col-md-6');
    col2.classList.add('col-12');
    const card = col2.querySelector('.card');
    if(card) card.style.height = '98vh';
  }
  
  // Request full screen API to cover browser menus
  const elem = document.documentElement;
  if(elem.requestFullscreen){
    elem.requestFullscreen().catch(err => console.warn('Fullscreen request failed:', err));
  } else if(elem.webkitRequestFullscreen){
    elem.webkitRequestFullscreen();
  } else if(elem.mozRequestFullScreen){
    elem.mozRequestFullScreen();
  } else if(elem.msRequestFullscreen){
    elem.msRequestFullscreen();
  }
  
  // Rebuild grid
  fetchDashboardData({ priority: true });
}

function exitFullscreenMode(){
  if(!isFullscreenMode) return;
  isFullscreenMode = false;
  
  const col1 = document.getElementById('activeCol');
  const leftCol = document.getElementById('studentsCol');
  const rightCol = document.getElementById('checkedCol');
  
  if(col1){
    col1.className = 'col dashboard-col';
    col1.querySelector('.card').style.height = '';
  }

  if(leftCol) leftCol.style.display = '';
  if(rightCol) rightCol.style.display = '';
  
  // Exit full screen API
  if(document.fullscreenElement){
    document.exitFullscreen().catch(err => console.warn('Exit fullscreen failed:', err));
  } else if(document.webkitFullscreenElement){
    document.webkitExitFullscreen();
  } else if(document.mozFullScreenElement){
    document.mozCancelFullScreen();
  } else if(document.msFullscreenElement){
    document.msExitFullscreen();
  }
  
  // Rebuild grid with normal seat count
  fetchDashboardData({ priority: true });
}

function formatHHMM(sec){
  const safeSec = Math.max(0, Number(sec) || 0);
  const h=Math.floor(safeSec/3600), m=Math.floor(safeSec%3600/60);
  return [h,m].map(v=>String(v).padStart(2,"0")).join(":");
}
function formatSessionTime(seconds){
  const mins=Math.floor(seconds/60), h=Math.floor(mins/60), m=mins%60;
  return `${h} h ${m} m`;
}

function escapeHtmlAttr(value){
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function normalizeSubjectKey(value){
  return String(value ?? '').trim().toLowerCase();
}

function subjectBadgeClass(value){
  const key = normalizeSubjectKey(value);
  if (key === 'math') return 'subject-badge-math';
  if (key === 'reading') return 'subject-badge-reading';
  if (key === 'writing') return 'subject-badge-writing';
  return 'bg-secondary';
}

function subjectBadgeHtml(value){
  const subject = String(value ?? '').trim();
  if (!subject) return '';
  return `<span class="badge ${subjectBadgeClass(subject)} me-1" style="font-size:0.65em;">${escapeHtmlAttr(subject)}</span>`;
}

function sessionLimitSeconds(session){
  const plannedMinutes = Number(session && session.total_study_minutes);
  const subjects = Array.isArray(session && session.subjects)
    ? session.subjects.filter(Boolean)
    : [];

  const subjectDerivedMinutes = subjects.length > 0 ? subjects.length * 30 : 0;

  // Prefer the larger value to avoid under-timing students when one source is stale
  // (e.g., total_study_minutes still at 30 while two subjects are selected).
  if (Number.isFinite(plannedMinutes) && plannedMinutes > 0 && subjectDerivedMinutes > 0) {
    return Math.round(Math.max(plannedMinutes, subjectDerivedMinutes) * 60);
  }

  if (Number.isFinite(plannedMinutes) && plannedMinutes > 0) {
    return Math.round(plannedMinutes * 60);
  }

  if (subjectDerivedMinutes > 0) {
    return subjectDerivedMinutes * 60;
  }

  return 30 * 60;
}

function parseSessionStartTime(rawStartTime){
  const raw = String(rawStartTime || '').trim();
  if (!raw) {
    return new Date();
  }

  // Normalize unicode spacing artifacts from scanner/browser payloads.
  const cleaned = raw.replace(/[\u202f\u2009]/g, ' ').trim();

  // SQLite timestamps often come as "YYYY-MM-DD HH:MM:SS".
  // Try a local-time friendly ISO variant first.
  let dt = new Date(cleaned.includes('T') ? cleaned : cleaned.replace(' ', 'T'));
  if (Number.isNaN(dt.getTime())) {
    dt = new Date(cleaned);
  }

  // Final safety: never propagate an invalid start timestamp into timer math.
  if (Number.isNaN(dt.getTime())) {
    return new Date();
  }
  return dt;
}

function fitSeatCardName(nameEl){
  if(!nameEl) return;
  nameEl.style.removeProperty('font-size');
}

function fitAllSeatCardNames(){
  document.querySelectorAll('#seatGrid .seat-card .seat-name').forEach(fitSeatCardName);
}

function applyCardScaling() {
  const grid = document.getElementById('seatGrid');
  if (!grid) return;
  const gw = grid.clientWidth;
  const gh = grid.clientHeight;
  if (!gw || !gh) return;
  const gap = 6; // ~0.35rem between cells
  const cardW = (gw - 3 * gap) / 4;
  const cardH = (gh - 3 * gap) / 4;
  const photoSize = Math.round(Math.min(cardH * 0.43, cardW * 0.34, 140));
  const slotH    = Math.round(Math.min(cardH * 0.075, 20));
  const badgeFs  = Math.round(Math.min(cardH * 0.055, 12));
  grid.style.setProperty('--card-photo-size', `${photoSize}px`);
  grid.style.setProperty('--card-badge-fs',   `${badgeFs}px`);
  grid.style.setProperty('--card-slot-h',     `${slotH}px`);
  fitAllSeatCardNames();
}

function loadCheckedEmailSentMap(){
  try {
    const raw = localStorage.getItem(CHECKED_EMAIL_STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && typeof parsed === 'object'){
      Object.keys(parsed).forEach((sid) => {
        if(parsed[sid]) checkedEmailSentMap.set(Number(sid), true);
      });
    }
  } catch (_) {
    // ignore storage parsing failures
  }
}

function persistCheckedEmailSentMap(){
  try {
    const payload = {};
    for(const [sid, sent] of checkedEmailSentMap.entries()){
      if(sent) payload[String(sid)] = true;
    }
    localStorage.setItem(CHECKED_EMAIL_STORAGE_KEY, JSON.stringify(payload));
  } catch (_) {
    // ignore storage write failures
  }
}

function ensureDashboardSyncHealthBanner(){
  let el = document.getElementById('dashboardSyncHealthBanner');
  if(el) return el;

  el = document.createElement('div');
  el.id = 'dashboardSyncHealthBanner';
  el.style.position = 'fixed';
  el.style.left = '12px';
  el.style.bottom = '12px';
  el.style.zIndex = '2100';
  el.style.maxWidth = '420px';
  el.style.display = 'none';
  document.body.appendChild(el);
  return el;
}

function setDashboardSyncHealth(isHealthy, reason = ''){
  const banner = ensureDashboardSyncHealthBanner();
  if(isHealthy){
    banner.style.display = 'none';
    banner.innerHTML = '';
    return;
  }

  const stamped = dashboardLastGoodSyncAt > 0
    ? new Date(dashboardLastGoodSyncAt).toLocaleTimeString()
    : 'never';

  banner.style.display = 'block';
  banner.innerHTML = `
    <div class="alert alert-warning shadow-sm py-2 px-3 mb-0" role="status">
      <div class="fw-semibold"><i class="bi bi-wifi-off me-1"></i>Instructor link unstable</div>
      <div class="small">Showing last known class state. Last successful sync: ${escapeHtmlAttr(stamped)}.</div>
      <div class="small text-muted">${escapeHtmlAttr(String(reason || 'Live refresh failed temporarily.'))}</div>
    </div>`;
}

async function fetchJsonWithMeta(url){
  const res = await fetch(url, { cache: 'no-store' });
  const payload = await res.json().catch(() => null);
  return { res, payload, url };
}

function resolveApiErrorMessage(label, bundle){
  const res = bundle && bundle.res;
  const payload = bundle && bundle.payload;

  if(!res){
    return `${label}: no response`;
  }
  if(!res.ok){
    const remoteMessage = payload && typeof payload === 'object' && payload.error
      ? String(payload.error)
      : `HTTP ${res.status}`;
    return `${label}: ${remoteMessage}`;
  }
  if(!Array.isArray(payload)){
    return `${label}: unexpected payload format`;
  }
  return '';
}

function renderDashboardFromState(){
  const students = Array.isArray(dashboardState.students) ? dashboardState.students : [];
  const sessions = Array.isArray(dashboardState.sessions) ? dashboardState.sessions : [];
  const assistants = Array.isArray(dashboardState.assistants) ? dashboardState.assistants : [];

  // Deduplicate active sessions by student id (safety against duplicates)
  const seenActive = new Set();
  const uniqueSessions = [];
  for(const s of sessions){
    const sid = s.id ?? s.student_id ?? s.sid;
    if(sid == null) continue;
    if(!seenActive.has(sid)){
      seenActive.add(sid);
      uniqueSessions.push(s);
    }
  }
  const activeIds = seenActive;

  // Filter lists to ensure exclusivity across columns
  const studentsAvailable = (students||[])
    .filter(st => !activeIds.has(st.id));
  const checkedOnly = (students||[])
    .filter(st => st.status === 'checked' && !activeIds.has(st.id));
  const daySessionCount = checkedOnly.length + uniqueSessions.length;

  buildStudentList(studentsAvailable);
  buildSeatGrid(uniqueSessions);
  buildCheckedList(checkedOnly, daySessionCount);
  buildAssistantsList(assistants);
  checkStaffContinuousDutyPrompts(assistants);
}

function applyLocalCheckin(studentId, fallbackName){
  const sid = Number(studentId);
  if(!Number.isFinite(sid)) return;

  const nowIso = new Date().toISOString();
  let student = dashboardState.students.find(st => Number(st.id) === sid);
  if(!student){
    student = {
      id: sid,
      name: fallbackName || `Student ${sid}`,
      subject: '',
      subjects: [],
      status: 'active',
      total_study_minutes: 30,
      photo_url: '',
      photo_data_uri: '',
    };
    dashboardState.students.push(student);
  }

  student.status = 'active';
  student.start_time = nowIso;

  if(!dashboardState.sessions.some(sess => Number(sess.id ?? sess.student_id ?? sess.sid) === sid)){
    dashboardState.sessions.push({
      id: sid,
      student_id: sid,
      name: student.name || fallbackName || `Student ${sid}`,
      subject: student.subject || '',
      subjects: Array.isArray(student.subjects) ? student.subjects : [],
      total_study_minutes: Number(student.total_study_minutes) > 0 ? Number(student.total_study_minutes) : 30,
      photo_url: student.photo_url || '',
      photo_data_uri: student.photo_data_uri || '',
      start_time: nowIso,
    });
  }

  renderDashboardFromState();
}

function applyLocalCheckout(studentId, checkoutEmailStatus){
  const sid = Number(studentId);
  if(!Number.isFinite(sid)) return;

  dashboardState.sessions = (dashboardState.sessions || []).filter(
    sess => Number(sess.id ?? sess.student_id ?? sess.sid) !== sid
  );

  const student = dashboardState.students.find(st => Number(st.id) === sid);
  if(student){
    student.status = 'checked';
    if(!Number.isFinite(Number(student.total_seconds))){
      student.total_seconds = 0;
    }
  }

  if(checkoutEmailStatus === 'sent'){
    checkedEmailSentMap.set(sid, true);
    persistCheckedEmailSentMap();
  }

  renderDashboardFromState();
}

window.addEventListener('resize', () => {
  requestAnimationFrame(applyCardScaling);
});

// Re-scale cards whenever the grid itself changes size (e.g. panel show/hide)
(function setupCardScalingObserver() {
  const grid = document.getElementById('seatGrid');
  if (!grid || !window.ResizeObserver) return;
  new ResizeObserver(() => requestAnimationFrame(applyCardScaling)).observe(grid);
})();


async function fetchDashboardData(options = {}){
  const priority = !!options.priority;
  if(dashboardFetchInFlight){
    if(priority){
      dashboardRefreshQueued = true;
    }
    return;
  }
  dashboardFetchInFlight = true;
  const refreshToken = ++dashboardRefreshToken;
  try {
    const [studentsBundle, sessionsBundle, assistantsBundle] = await Promise.all([
      fetchJsonWithMeta('/api/students/list'),
      fetchJsonWithMeta('/api/sessions/active'),
      fetchJsonWithMeta('/api/assistants/list'),
    ]);

    if (refreshToken !== dashboardRefreshToken) {
      return;
    }

    const nextState = {
      students: Array.isArray(dashboardState.students) ? dashboardState.students : [],
      sessions: Array.isArray(dashboardState.sessions) ? dashboardState.sessions : [],
      assistants: Array.isArray(dashboardState.assistants) ? dashboardState.assistants : [],
    };

    const failureMessages = [];

    const studentsError = resolveApiErrorMessage('Students', studentsBundle);
    if(studentsError){
      failureMessages.push(studentsError);
    } else {
      nextState.students = studentsBundle.payload;
    }

    const sessionsError = resolveApiErrorMessage('Active sessions', sessionsBundle);
    if(sessionsError){
      failureMessages.push(sessionsError);
    } else {
      nextState.sessions = sessionsBundle.payload;
    }

    const assistantsError = resolveApiErrorMessage('Assistants', assistantsBundle);
    if(assistantsError){
      failureMessages.push(assistantsError);
    } else {
      nextState.assistants = assistantsBundle.payload;
      lastAssistantsSnapshot = assistantsBundle.payload;
    }

    dashboardState.students = nextState.students;
    dashboardState.sessions = nextState.sessions;
    dashboardState.assistants = nextState.assistants;
    renderDashboardFromState();

    if(failureMessages.length > 0){
      dashboardDataDegraded = true;
      dashboardDataDegradedReason = failureMessages.join(' | ');
      setDashboardSyncHealth(false, dashboardDataDegradedReason);
      console.warn('[dashboard] partial refresh degraded:', dashboardDataDegradedReason);
      if(priority && typeof window.showQuickToast === 'function'){
        window.showQuickToast('Live sync delayed. Showing last known class state.', true);
      }
    } else {
      const wasDegraded = dashboardDataDegraded;
      dashboardDataDegraded = false;
      dashboardDataDegradedReason = '';
      dashboardLastGoodSyncAt = Date.now();
      setDashboardSyncHealth(true);
      if(wasDegraded && typeof window.showQuickToast === 'function'){
        window.showQuickToast('Instructor link restored. Live class sync resumed.');
      }
    }
  } catch (err) {
    if (refreshToken !== dashboardRefreshToken) {
      return;
    }
    dashboardDataDegraded = true;
    dashboardDataDegradedReason = String((err && err.message) || err || 'Unknown dashboard refresh error');
    setDashboardSyncHealth(false, dashboardDataDegradedReason);
    console.warn('[dashboard] refresh failed, preserving current state:', err);
    if(priority && typeof window.showQuickToast === 'function'){
      window.showQuickToast('Live sync failed temporarily. Keeping current class view.', true);
    }
  } finally {
    dashboardFetchInFlight = false;
    if(dashboardRefreshQueued){
      dashboardRefreshQueued = false;
      fetchDashboardData({ priority: true });
    }
  }
}

function startDashboardPolling(){
  if(dashboardPollTimer) return;
  dashboardPollTimer = setInterval(() => {
    if(document.visibilityState !== 'visible') return;
    fetchDashboardData({ priority: false });
  }, DASHBOARD_POLL_MS);
}
// ---------- Column 2 (Staff) ----------

// Continuous on-duty "still active?" prompt (4h15m boundary, 2min grace before auto checkout)
let dutyPromptActive = null; // { id, name, tickInterval, modalInstance }
let dutyPromptQueue = [];
const localDutyConfirmedAt = new Map(); // assistantId -> ms timestamp (optimistic, until server catches up)

function ensureStaffDutyPromptModal(){
  let el = document.getElementById('staffDutyPromptModal');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'staffDutyPromptModal';
  el.className = 'modal fade';
  el.tabIndex = -1;
  el.setAttribute('data-bs-backdrop', 'static');
  el.setAttribute('data-bs-keyboard', 'false');
  el.innerHTML = `
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning-subtle">
          <h5 class="modal-title"><i class="bi bi-exclamation-triangle-fill text-warning me-1"></i> Still on duty?</h5>
        </div>
        <div class="modal-body">
          <p id="staffDutyPromptMessage" class="mb-2"></p>
          <p class="small text-muted mb-0">Auto checkout in <strong id="staffDutyPromptCountdown">02:00</strong> if no response.</p>
        </div>
        <div class="modal-footer">
          <button type="button" id="staffDutyPromptConfirmBtn" class="btn btn-success">
            <i class="bi bi-check-circle"></i> Yes, still working
          </button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(el);
  document.getElementById('staffDutyPromptConfirmBtn').addEventListener('click', onStaffDutyPromptConfirm);
  return el;
}

async function onStaffDutyPromptConfirm(){
  if(!dutyPromptActive) return;
  const { id } = dutyPromptActive;
  const btn = document.getElementById('staffDutyPromptConfirmBtn');
  if(btn) btn.disabled = true;
  try {
    await fetch(`/api/assistants/confirm-duty/${id}`, { method: 'POST' });
    localDutyConfirmedAt.set(id, Date.now());
  } catch (_) {
    // ignore; server-side safety net still enforces the boundary
  }
  if(btn) btn.disabled = false;
  closeStaffDutyPrompt();
}

function closeStaffDutyPrompt(){
  if(!dutyPromptActive) return;
  const { tickInterval, modalInstance } = dutyPromptActive;
  if(tickInterval) clearInterval(tickInterval);
  if(modalInstance) modalInstance.hide();
  dutyPromptActive = null;
  processDutyPromptQueue();
}

function processDutyPromptQueue(){
  if(dutyPromptActive || dutyPromptQueue.length === 0) return;
  showStaffDutyPrompt(dutyPromptQueue.shift());
}

function showStaffDutyPrompt(entry){
  const { id, name, graceRemainingMs } = entry;
  const modalEl = ensureStaffDutyPromptModal();
  const messageEl = document.getElementById('staffDutyPromptMessage');
  if(messageEl){
    messageEl.textContent = `${name} has been on duty continuously for over 4h15m. Are they still active?`;
  }

  const deadlineTs = Date.now() + Math.max(1000, graceRemainingMs);
  const countdownEl = document.getElementById('staffDutyPromptCountdown');

  function tick(){
    const remainingMs = Math.max(0, deadlineTs - Date.now());
    const totalSec = Math.ceil(remainingMs / 1000);
    const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const ss = String(totalSec % 60).padStart(2, '0');
    if(countdownEl) countdownEl.textContent = `${mm}:${ss}`;
    if(remainingMs <= 0){
      autoCheckoutStaffFromPrompt(id, name);
    }
  }
  tick();
  const tickInterval = setInterval(tick, 1000);

  const modalInstance = new bootstrap.Modal(modalEl);
  modalInstance.show();

  dutyPromptActive = { id, name, tickInterval, modalInstance };
}

async function autoCheckoutStaffFromPrompt(id, name){
  if(!dutyPromptActive || dutyPromptActive.id !== id) return;
  clearInterval(dutyPromptActive.tickInterval);
  const modalInstance = dutyPromptActive.modalInstance;
  dutyPromptActive = null;
  try {
    await fetch(`/api/assistants/select/${id}`, { method: 'POST' });
  } catch (_) {
    // backend safety net will also auto-close stale continuous sessions
  }
  if(modalInstance) modalInstance.hide();
  if (typeof window.showQuickToast === 'function') {
    window.showQuickToast(`${name} was auto checked out after no response.`, true);
  }
  fetchDashboardData({ priority: true });
  processDutyPromptQueue();
}

function checkStaffContinuousDutyPrompts(assistants){
  const list = Array.isArray(assistants) ? assistants : [];
  const onDutyIds = new Set();
  const now = Date.now();

  list.forEach(a => {
    if(!a || !a.on_duty || !Number.isFinite(Number(a.id))) return;
    const id = Number(a.id);
    onDutyIds.add(id);

    const startMs = a.start_time ? parseSessionStartTime(a.start_time).getTime() : NaN;
    if(!Number.isFinite(startMs)) return;

    const serverConfirmedMs = a.duty_last_confirmed_at ? parseSessionStartTime(a.duty_last_confirmed_at).getTime() : NaN;
    const localConfirmedMs = localDutyConfirmedAt.get(id) || 0;
    const continuousSinceMs = Math.max(startMs, Number.isFinite(serverConfirmedMs) ? serverConfirmedMs : 0, localConfirmedMs);

    const limitMs = (Number(a.duty_continuous_limit_seconds) || 15300) * 1000;
    const graceMs = (Number(a.duty_confirm_grace_seconds) || 120) * 1000;
    const elapsedMs = now - continuousSinceMs;

    if(elapsedMs < limitMs) return;
    if(dutyPromptActive && dutyPromptActive.id === id) return;
    if(dutyPromptQueue.some(e => e.id === id)) return;

    const graceRemainingMs = Math.max(0, limitMs + graceMs - elapsedMs);
    dutyPromptQueue.push({ id, name: a.name || `Staff ${id}`, graceRemainingMs });
  });

  for(const id of Array.from(localDutyConfirmedAt.keys())){
    if(!onDutyIds.has(id)) localDutyConfirmedAt.delete(id);
  }

  if(dutyPromptActive && !onDutyIds.has(dutyPromptActive.id)){
    closeStaffDutyPrompt();
  }
  dutyPromptQueue = dutyPromptQueue.filter(e => onDutyIds.has(e.id));

  processDutyPromptQueue();
}

function buildAssistantsList(assistants){
  const list = document.getElementById("assistantsDutyList");
  const onDuty = assistants.filter(a => a.on_duty);
  
  if(!list) return;

  list.innerHTML = "";

  if(onDuty.length === 0){
    list.innerHTML = `<div class="col-12"><small class="text-muted">No staff on duty</small></div>`;
    return;
  }

  onDuty.forEach(a => {
    const div = document.createElement("div");
    div.className = "duty-mini-item";
    div.innerHTML = `
      <div class="card duty-mini-card border-info bg-light" title="Click to toggle staff on/off duty">
        <div class="fw-bold text-dark duty-mini-name">${a.name}</div>
      </div>
    `;
    list.appendChild(div);
    
    // Add click handler to card
    const cardEl = div.querySelector('.card');
    if(!IS_READONLY_DASHBOARD){
      cardEl.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        toggleAssistantDuty(a.id);
      });
    } else {
      cardEl.style.cursor = 'not-allowed';
      cardEl.title = 'Read-only on Instructor Station';
    }

// Manually turn all active assistants off duty at once
async function offTimeAllAssistants() {
  const btn = document.getElementById('offTimeAllAssistantsButton');
  const prevHtml = btn ? btn.innerHTML : '';
  const prevDisabled = btn ? btn.disabled : false;

  try {
    if (!confirm('Turn OFF duty for all currently active assistants?')) {
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Off Timing...';
    }

    const listRes = await fetch('/api/assistants/list', { cache: 'no-store' });
    const assistants = await listRes.json().catch(() => []);
    if (!listRes.ok || !Array.isArray(assistants)) {
      throw new Error('Could not load staff list');
    }

    const onDuty = assistants.filter(a => a && a.on_duty && Number.isFinite(Number(a.id)));

    if (onDuty.length === 0) {
      if (typeof window.showQuickToast === 'function') {
        window.showQuickToast('All assistants are already off duty');
      }
      if (typeof fetchDashboardData === 'function') {
        fetchDashboardData({ priority: true });
      }
      return;
    }

    const results = await Promise.all(onDuty.map(async (asst) => {
      try {
        const res = await fetch(`/api/assistants/select/${asst.id}`, { method: 'POST' });
        const payload = await res.json().catch(() => ({}));
        return { ok: !!(res.ok && payload && payload.success), name: asst.name || `Staff ${asst.id}` };
      } catch (_) {
        return { ok: false, name: asst.name || `Staff ${asst.id}` };
      }
    }));

    const successCount = results.filter(r => r.ok).length;
    const failCount = results.length - successCount;

    if (typeof window.showQuickToast === 'function') {
      if (failCount === 0) {
        window.showQuickToast(`${successCount} assistant${successCount === 1 ? '' : 's'} set to off duty`);
      } else {
        window.showQuickToast(`${successCount} off duty, ${failCount} failed`, true);
      }
    }

    if (typeof fetchDashboardData === 'function') {
      fetchDashboardData({ priority: true });
    }

    const staffDutyListEl = document.getElementById('staffDutyList');
    if (staffDutyListEl && typeof loadStaffDutyModal === 'function') {
      loadStaffDutyModal();
    }
  } catch (error) {
    console.error('Error setting all assistants off duty:', error);
    if (typeof window.showQuickToast === 'function') {
      window.showQuickToast(error.message || 'Failed to set assistants off duty', true);
    }
  } finally {
    if (btn) {
      btn.disabled = prevDisabled;
      btn.innerHTML = prevHtml || '<i class="bi bi-person-dash"></i> Off Time All';
    }
  }
}

// Load and display all staff in modal
function loadStaffDutyModal() {
  const listContainer = document.getElementById('staffDutyList');
  listContainer.innerHTML = '<p class="text-muted text-center">Loading staff...</p>';

  function renderStaffRows(assistants) {
    if (!assistants || assistants.length === 0) {
      listContainer.innerHTML = '<p class="text-muted text-center">No staff available</p>';
      return;
    }

    listContainer.innerHTML = '';
    assistants.forEach(asst => {
      const item = document.createElement('div');
      item.className = 'list-group-item';
      item.style.cursor = 'pointer';
      item.style.display = 'flex';
      item.style.justifyContent = 'space-between';
      item.style.alignItems = 'center';
      item.innerHTML = `
        <div>
          <strong>${asst.name}</strong>
          ${asst.role ? `<br><small class="text-muted">${asst.role}</small>` : ''}
        </div>
        <div class="staff-duty-status">
          ${asst.on_duty ?
            `<span class="badge bg-success"><i class="bi bi-check-circle"></i> On Duty</span>` :
            `<span class="badge bg-secondary">Off Duty</span>`}
        </div>
      `;

      item.addEventListener('click', function() {
        if (item.dataset.pending === '1') {
          return;
        }
        toggleStaffAndRefresh(asst.id, item);
      });

      item.addEventListener('mouseenter', function() {
        this.style.backgroundColor = '#f0f0f0';
      });

      item.addEventListener('mouseleave', function() {
        this.style.backgroundColor = 'transparent';
      });

      listContainer.appendChild(item);
    });
  }
  
  fetch('/api/assistants/list')
    .then(async response => {
      const payload = await response.json().catch(() => null);
      if (!response.ok) {
        const msg = payload && payload.error ? payload.error : `HTTP ${response.status}`;
        throw new Error(msg);
      }
      if (!Array.isArray(payload)) {
        throw new Error('Unexpected staff payload format');
      }
      return payload;
    })
    .then(assistants => {
      lastAssistantsSnapshot = assistants;
      renderStaffRows(assistants);
    })
    .catch(error => {
      console.error('Error loading staff:', error);
      if (Array.isArray(lastAssistantsSnapshot) && lastAssistantsSnapshot.length > 0) {
        renderStaffRows(lastAssistantsSnapshot);
        if (typeof showQuickToast === 'function') {
          showQuickToast('Live staff refresh failed; showing cached list', true);
        }
      } else {
        listContainer.innerHTML = '<p class="text-danger text-center">Error loading staff</p>';
      }
    });
}

  function buildStudentList(data){
    const list=document.getElementById("studentList");
    list.innerHTML="";
    
    // Get today's day name
    const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const today = days[new Date().getDay()];
    
    // Filter non-active students (registered + checked)
    const availableStudents = data.filter(s => s.status !== "active");
    
    // Separate students into scheduled for today and others
    const scheduledToday = [];
    const others = [];
    
    availableStudents.forEach(s => {
      const scheduleEntries = Array.isArray(s.schedule)
        ? s.schedule
        : [
            { day: s.day1, time: s.day1_time },
            { day: s.day2, time: s.day2_time },
            { day: s.day3, time: s.day3_time },
            { day: s.day4, time: s.day4_time },
            { day: s.day5, time: s.day5_time },
            { day: s.day6, time: s.day6_time }
          ].filter(entry => entry.day);

      const todayEntry = scheduleEntries.find(entry => entry && entry.day === today);

      if (todayEntry) {
        scheduledToday.push({ student: s, time: todayEntry.time || null });
      } else {
        others.push(s);
      }
    });
    
    // Sort scheduled students by time
    scheduledToday.sort((a, b) => {
      if (!a.time || !b.time) return 0;
      return a.time.localeCompare(b.time);
    });
    
    // Sort others alphabetically by name
    others.sort((a, b) => a.name.localeCompare(b.name));
    
    // Helper function to create student entry
    function createStudentEntry(s, timeDisplay = null) {
      const div = document.createElement("div");
      div.className = "p-2 border rounded mb-1 hover-bg d-flex align-items-center";
      const info = document.createElement('div');
      info.className = 'flex-fill';
      const badges = [];
      const subjectsList = (s.subjects && s.subjects.length > 0) ? s.subjects : (s.subject ? [s.subject] : []);
      subjectsList.forEach(sub => badges.push(subjectBadgeHtml(sub)));
      if (s.book_loaned) badges.push('<span class="badge bg-light text-dark border me-1" style="font-size:0.65em;">B</span>');
      if (s.device_loaned) badges.push('<span class="badge bg-light text-dark border me-1" style="font-size:0.65em;">D</span>');
      const badgeDisplay = badges.length > 0 ? badges.join('') : '<span class="text-muted">-</span>';
      
      const checkedBadge = s.status === 'checked'
        ? ' <span class="badge bg-secondary" style="font-size:0.65em;">Checked out</span>'
        : '';

      const nameDisplay = timeDisplay 
        ? `<b>${s.name}</b>${checkedBadge} <span class="text-primary">(${timeDisplay})</span>`
        : `<b>${s.name}</b>${checkedBadge}`;
      
      info.innerHTML = `${nameDisplay}<br><small>${badgeDisplay}</small>`;
      div.appendChild(info);
      if(!IS_READONLY_DASHBOARD){
        div.onclick = async () => {
          if (confirm("Start session for " + s.name + "?")) {
            try {
              const res = await fetch(`/api/students/start/${s.id}`, { method: 'POST' });
              if (!res.ok) {
                let errorMessage = 'Failed to start session';
                try {
                  const payload = await res.json();
                  if (payload && payload.error) {
                    errorMessage = payload.error;
                  }
                } catch (e) {
                  // keep default message when response isn't JSON
                }
                alert(errorMessage);
                return;
              }
              try {
                applyLocalCheckin(s.id, s.name);
                fetchDashboardData({ priority: true });
              } catch (refreshErr) {
                console.error('[dashboard] check-in succeeded but UI refresh failed', refreshErr);
                // Keep success path; this is a render/refresh issue, not a check-in failure.
                alert('Student checked in, but the class display did not refresh. Please reload the page.');
              }
            } catch (err) {
              alert('Failed to start session. Please try again.');
            }
          }
        };
      } else {
        div.style.cursor = 'not-allowed';
        div.title = 'Read-only on Instructor Station';
      }
      return div;
    }
    
    // Add scheduled students first
    scheduledToday.forEach(({student: s, time}) => {
      list.appendChild(createStudentEntry(s, time));
    });
    
    // Add remaining students
    others.forEach(s => {
      list.appendChild(createStudentEntry(s));
    });
    
    document.getElementById("registeredCount").innerText=
      `${availableStudents.length} students available`;

}

function buildSeatGrid(activeSessions){
  const grid=document.getElementById("seatGrid");
  if(!grid) return;

  document.getElementById("activeCount").innerText=
    `(${activeSessions.length} active)`;
  const seatLimit = SEAT_LIMIT; // always 16 (4×4)

  // Identify which student IDs are still active
  const incomingIds = new Set();
  activeSessions.forEach(s => {
    const sid = s.id ?? s.student_id ?? s.sid;
    if(sid != null) incomingIds.add(sid);
  });

  // Clear timers only for sessions that ended
  for(const [sid, handle] of activeSeatCards.entries()){
    if(!incomingIds.has(sid)){
      clearInterval(handle.timerId);
      activeSeatCards.delete(sid);
    }
  }

  // Rebuild grid, reusing existing card DOM nodes for ongoing sessions
  grid.innerHTML="";
  const newMap = new Map();

  for(let i=0;i<seatLimit;i++){
    const seatLabel="Seat "+(i+1);
    const col=document.createElement("div"); col.className="";
    const s=activeSessions[i];
    if(s){
      const sid = s.id ?? s.student_id ?? s.sid;
      const existing = activeSeatCards.get(sid);

      if(existing){
        // Reuse existing card — timer keeps running, no flicker
        col.appendChild(existing.card);
        grid.appendChild(col);
        fitSeatCardName(existing.card.querySelector('.seat-name'));
        newMap.set(sid, existing);
      } else {
        // New session: build card and start timer
        const start = parseSessionStartTime(s.start_time);
        const limit = sessionLimitSeconds(s);

        const card=document.createElement("div");
        card.className="card shadow-sm seat-card";

        // Build photo HTML
        const photoSrc = s.photo_data_uri || s.photo_url || '';
        const safeName = escapeHtmlAttr(s.name || 'Student');
        const safePhotoSrc = escapeHtmlAttr(photoSrc);
        const photoHtml = photoSrc
          ? `<div style="width:var(--card-photo-size);height:var(--card-photo-size);position:relative;flex-shrink:0;">
               <img src="${safePhotoSrc}" alt="${safeName}" style="width:var(--card-photo-size);height:var(--card-photo-size);object-fit:cover;border-radius:50%;border:2px solid #dee2e6;display:block;">
               <div style="width:var(--card-photo-size);height:var(--card-photo-size);border-radius:50%;border:2px solid #dee2e6;background:#e9ecef;display:none;align-items:center;justify-content:center;"><i class="bi bi-person" style="font-size:3em;color:#adb5bd;"></i></div>
             </div>`
          : `<div style="width:var(--card-photo-size);height:var(--card-photo-size);border-radius:50%;border:2px solid #dee2e6;background:#e9ecef;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="bi bi-person" style="font-size:3em;color:#adb5bd;"></i></div>`;

        card.innerHTML=`
          <div class="seat-card-header">
            <div class="fw-bold seat-name" title="${safeName}">${safeName}</div>
          </div>
          <div class="seat-card-body">
            <div class="column-left">
              ${photoHtml}
            </div>
            <div class="column-right">
              <div class="timer fw-bold text-success">--:--</div>
            </div>
          </div>`;
        if(!IS_READONLY_DASHBOARD){
          card.onclick=async()=>{
            if(confirm("Stop session for "+s.name+"?")){
              try {
                const res = await fetch(`/api/students/stop/${s.id}`,{method:'POST'});
                const j = await res.json().catch(()=>({}));
                if(res.ok){
                  applyLocalCheckout(s.id, j && j.checkout_email_status);
                }
              } catch(err){
                console.debug('[dashboard] student checkout request failed', err);
              } finally {
                fetchDashboardData({ priority: true });
              }
            }
          };
        } else {
          card.style.cursor = 'default';
          card.title = 'Read-only on Instructor Station';
        }
        fitSeatCardName(card.querySelector('.seat-name'));
        col.appendChild(card); grid.appendChild(col);
        const tEl=card.querySelector(".timer");
        const updateSeatTimer = ()=>{
          const diff = Math.max(0, Math.floor((Date.now() - start.getTime()) / 1000));
          tEl.textContent=formatHHMM(diff);
          tEl.classList.toggle("text-danger",diff>limit);
          tEl.classList.toggle("text-success",diff<=limit);
        };
        updateSeatTimer();
        const timerId = setInterval(updateSeatTimer, CARD_TIMER_TICK_MS);
        newMap.set(sid, { card, timerId });
      }
    }else{
      const emptyCard = document.createElement("div");
      emptyCard.className = "card shadow-sm seat-card seat-empty d-flex align-items-center justify-content-center text-center";
      emptyCard.innerHTML = `<div class="fw-light text-muted" style="font-size:0.9em;">${seatLabel}</div>`;
      col.appendChild(emptyCard);
      grid.appendChild(col);
    }

    requestAnimationFrame(applyCardScaling);
  }

  // Swap in the new map (stale entries already cleared above)
  activeSeatCards = newMap;

  // Clear stale overflow timers (rebuilt fresh each render)
  for(const [, tid] of overflowTimers.entries()) clearInterval(tid);
  overflowTimers.clear();

  // Handle overflow students (17th+ in class)
  const overflowContainer = document.getElementById('overflowStudents');
  const overflowList = document.getElementById('overflowList');
  const overflowCountEl = document.getElementById('overflowCount');
  const overflowStudents = activeSessions.slice(seatLimit);

  if(overflowStudents.length > 0){
    overflowContainer.style.display = 'block';
    if(overflowCountEl) overflowCountEl.textContent = `(${overflowStudents.length})`;
    overflowList.innerHTML = '';
    overflowStudents.forEach(s => {
      const sid = s.id ?? s.student_id ?? s.sid;
      const start = parseSessionStartTime(s.start_time);
      const limit = sessionLimitSeconds(s);

      const row = document.createElement('div');
      row.className = 'overflow-student-row';
      row.innerHTML = `
        <span class="overflow-name fw-semibold">${escapeHtmlAttr(s.name)}</span>
        <span class="overflow-timer-badge">--:--</span>`;

      const timerEl = row.querySelector('.overflow-timer-badge');
      const nameEl  = row.querySelector('.overflow-name');

      // Live elapsed timer for overflow student
      const updateOverflowTimer = () => {
        const elapsed = Math.max(0, Math.floor((Date.now() - start.getTime()) / 1000));
        timerEl.textContent = formatHHMM(elapsed);
        const over = elapsed > limit;
        row.classList.toggle('over-time', over);
      };
      updateOverflowTimer();
      const tid = setInterval(updateOverflowTimer, CARD_TIMER_TICK_MS);
      overflowTimers.set(sid, tid);

      if(!IS_READONLY_DASHBOARD){
        row.onclick = async () => {
          if(confirm(`Stop session for ${s.name}?`)){
            try {
              const res = await fetch(`/api/students/stop/${s.id}`, {method:'POST'});
              const j = await res.json().catch(()=>({}));
              if(res.ok){
                applyLocalCheckout(s.id, j && j.checkout_email_status);
              }
            } catch(err){
              console.debug('[dashboard] overflow checkout failed', err);
            } finally {
              fetchDashboardData({ priority: true });
            }
          }
        };
      } else {
        row.style.cursor = 'default';
        row.title = 'Read-only on Instructor Station';
      }
      overflowList.appendChild(row);
    });
  } else {
    overflowContainer.style.display = 'none';
    if(overflowCountEl) overflowCountEl.textContent = '';
  }
}

    wrap.style.display=debugPanelVisible ? 'block' : 'none';
    wrap.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; padding:6px 8px; background:var(--brand-primary); color:#fff; border-radius:6px 6px 0 0;">
        <strong style="font-size:0.95em;">Scanner Debug Log</strong>
        <div>
          <button id="dashDebugToggle" class="btn btn-sm btn-light py-0 px-1">Hide</button>
          <button id="dashDebugCopy" class="btn btn-sm btn-light py-0 px-1">Copy</button>
          <button id="dashDebugClear" class="btn btn-sm btn-outline-light py-0 px-1">Clear</button>
        </div>
      </div>
      <textarea id="dashDebugArea" readonly tabindex="-1" style="width:100%; height:180px; font-size:12px; font-family:monospace; border:0; padding:6px; resize:none; outline:none; user-select:text;"></textarea>
    `;
    document.body.appendChild(wrap);
    document.getElementById('dashDebugToggle').onclick = () => {
      debugPanelVisible = !debugPanelVisible;
      localStorage.setItem('dashDebugPanelVisible', debugPanelVisible);
      wrap.style.display = debugPanelVisible ? 'block' : 'none';
      const btn = document.getElementById('dashDebugToggle');
      btn.textContent = debugPanelVisible ? 'Hide' : 'Show';
    };
    document.getElementById('dashDebugCopy').onclick = () => {
      const ta = document.getElementById('dashDebugArea');
      ta.select();
      document.execCommand('copy');
    };
    document.getElementById('dashDebugClear').onclick = () => {
      const ta = document.getElementById('dashDebugArea');
      ta.value='';
    };
  }

  function logDebug(msg){
    ensureDebugPanel();
    const ta = document.getElementById('dashDebugArea');
    const ts = new Date().toLocaleTimeString();
    ta.value += `[${ts}] ${msg}\n`;
    ta.scrollTop = ta.scrollHeight;
    console.debug('[dashboard][scan]', msg);
  }

  function isTypingInField(){
    const ae = document.activeElement;
    if(!ae) return false;
    const tag = ae.tagName?.toLowerCase();
    const isEditable = ae.isContentEditable;
    // Allow scanning even if search field is focused, but don't intercept
    // normal typing (scanner sends rapid keystrokes, we collect globally)
    return (tag === 'textarea') || (tag === 'input' && ae.type !== 'button' && ae.type !== 'checkbox' && ae.type !== 'radio') || isEditable;
  }

  function deduplicateCharacters(str){
    // Scanner sends each character 4x for error correction: IIIIDDDD -> ID
    if(!str || str.length < 2) return str;
    
    // Try different repeat factors (4x, 3x, 2x)
    for(let n of [4, 3, 2]){
      if(str.length % n !== 0) continue;
      let candidate = '';
      let matches = true;
      for(let i=0; i<str.length; i+=n){
        const chunk = str.substring(i, i+n);
        const firstChar = chunk[0];
        if(chunk.split('').every(c => c === firstChar)){
          candidate += firstChar;
        } else {
          matches = false;
          break;
        }
      }
      if(matches && candidate.length > 0){
        logDebug(`CHAR DEDUP: ${n}x repetition detected`);
        return candidate;
      }
    }
    return str;
  }

  function normalizePayload(str){
    return String(str||'')
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .replace(/[\u202F\u2009\u00A0]/g, ' ')
      .trim();
  }

  function normalizeIsbnToken(str){
    return String(str || '').replace(/[^0-9Xx]/g, '').toUpperCase();
  }

  function isValidIsbn10(token){
    if(!token || token.length !== 10) return false;
    const body = token.slice(0, 9);
    const check = token[9];
    if(!/^\d{9}$/.test(body)) return false;
    if(!/^(\d|X)$/.test(check)) return false;
    let sum = 0;
    for(let i = 0; i < 9; i++){
      sum += (10 - i) * Number(body[i]);
    }
    sum += (check === 'X' ? 10 : Number(check));
    return (sum % 11) === 0;
  }

  function isValidIsbn13(token){
    if(!token || token.length !== 13 || !/^\d{13}$/.test(token)) return false;
    let sum = 0;
    for(let i = 0; i < 12; i++){
      const n = Number(token[i]);
      sum += (i % 2 === 0) ? n : n * 3;
    }
    const expected = (10 - (sum % 10)) % 10;
    return expected === Number(token[12]);
  }

  function looksLikeDeviceQrPayload(data){
    const txt = String(data || '').toUpperCase();
    // Device QR payloads use MAT:/MATERIAL patterns and/or Code:MAT-...
    if(/(?:^|\b)(MAT|MATERIAL)\s*[:;=#-]?\s*\d+\b/.test(txt)) return true;
    if(/\bCODE\s*[:;=]\s*MAT-[A-Z0-9-]+\b/.test(txt)) return true;
    return false;
  }

  function looksLikeStructuredIdentityQr(data){
    const txt = String(data || '').trim();
    if(!txt) return false;
    return /(?:^|\n)\s*(ID|ASST|ASSISTANT|NAME|UID)\s*[:;=]/i.test(txt);
  }

  function extractValidIsbn(data){
    const txt = String(data || '').trim();
    if(!txt) return null;

    // Student/staff QR payloads may contain a UID whose digits can coincidentally
    // form a valid ISBN checksum; never route those away from attendance flows.
    if(looksLikeStructuredIdentityQr(txt)){
      return null;
    }

    // Prefer explicit ISBN labels when present.
    const labeled = txt.match(/ISBN(?:-1[03])?\s*[:;=]?\s*([0-9Xx\-\s]{10,20})/i);
    if(labeled){
      const token = normalizeIsbnToken(labeled[1]);
      if((token.length === 10 && isValidIsbn10(token)) || (token.length === 13 && isValidIsbn13(token))){
        return token;
      }
    }

    // Fallback: whole payload sanitized as ISBN barcode content.
    const token = normalizeIsbnToken(txt);
    if((token.length === 10 && isValidIsbn10(token)) || (token.length === 13 && isValidIsbn13(token))){
      return token;
    }
    return null;
  }

  function routeToLoanPage(url, reason){
    if(redirectInProgress) return;
    redirectInProgress = true;
    logDebug(`ROUTE -> ${url} (${reason})`);
    showQuickToast(`Scanner shortcut: opening ${reason}...`);
    setTimeout(() => { window.location.href = url; }, 120);
  }

  function deduplicateRepeatingDigits(numStr){
    if(!numStr || numStr.length < 2) return numStr;
    const uniqCount = new Set(numStr.split('')).size;

    // Case A: all digits identical
    if(uniqCount === 1){
      if(numStr.length <= 2) return numStr;
      // Guard against false positives: odd lengths like 111 are often valid
      // IDs, while duplicated scanner payloads are typically even-length.
      if(numStr.length % 2 !== 0) return numStr;
      // Collapse repeated scanner duplication only (e.g., 333333 -> 333).
      return numStr.slice(0, Math.floor(numStr.length / 2));
    }

    // Case B: digit-repeat-based (e.g., 5577 -> 57, each digit repeats n times)
    if(numStr.length % 2 === 0){
      for(let n=2; n<=numStr.length/2; n++){
        if(numStr.length % n === 0){
          let result = '';
          for(let i=0;i<numStr.length;i+=n) result += numStr[i];
          let reconstructed = '';
          for(const d of result){ for(let j=0;j<n;j++) reconstructed += d; }
          if(reconstructed === numStr) return result;
        }
      }
    }

    // Case C: pattern-based, but avoid collapsing to single digit
    for(let patternLen=2; patternLen<=Math.floor(numStr.length/2); patternLen++){
      const pattern = numStr.substring(0, patternLen);
      let repeated = '';
      for(let i=0;i<Math.ceil(numStr.length/patternLen);i++) repeated += pattern;
      if(repeated.substring(0, numStr.length) === numStr) return pattern;
    }

    return numStr;
  }

  async function finalizeScan(){
    let raw = scanBuffer;
    scanBuffer = '';
    if(finalizeTimer){ clearTimeout(finalizeTimer); finalizeTimer = null; }
    if(forceFinalizeTimer){ clearTimeout(forceFinalizeTimer); forceFinalizeTimer = null; }

    // Deduplicate character-level repetition first (scanner sends 4x chars)
    raw = deduplicateCharacters(raw);
    const data = normalizePayload(raw);
    if(!data) return;
    logDebug(`RAW=${JSON.stringify(raw)}`);

    // Hidden shortcut routing from class window:
    // - Device QR payloads -> Device Loan page
    // - Valid ISBN scans -> Book Loan page
    if(looksLikeDeviceQrPayload(data)){
      routeToLoanPage('/materials/loan', 'Device Loan');
      return;
    }

    const scannedIsbn = extractValidIsbn(data);
    if(scannedIsbn){
      routeToLoanPage('/books/loan', 'Book Loan');
      return;
    }

    // Parse type and id (supports ID and ASST)
    let type = null;
    let ident = null;

    // Pass 1: direct clean pattern, e.g., "ID:57" or "ASST:3"
    let m = data.match(/^(ID|ASST|ASSISTANT)\s*[:;=]?\s*(\d+)$/i);
    if(m){
      type = (m[1].toUpperCase()==='ASSISTANT') ? 'ASST' : m[1].toUpperCase();
      ident = parseInt(m[2],10);
      logDebug(`DIRECT match -> type=${type} id=${ident}`);
    }

    // Pass 2: flexible pattern with noise
    if(ident == null){
      m = data.match(/(ID|ASST|ASSISTANT)[^\d]*[:+;=]*([0-9]+)/i);
      if(m){
        type = (m[1].toUpperCase()==='ASSISTANT') ? 'ASST' : m[1].toUpperCase();
        let idStr = m[2];
        if(idStr.length < 2){
          const later = data.match(/(\d{2,6})(?!.*\d)/);
          if(later) idStr = later[1];
        }
        ident = parseInt(deduplicateRepeatingDigits(idStr),10);
        logDebug(`FLEX match -> type=${type} id=${ident} from ${idStr}`);
      }
    }

    // Pass 3: last digits anywhere (fallback)
    if(ident == null){
      m = data.match(/(\d{2,6})(?!.*\d)/);
      if(m){ ident = parseInt(deduplicateRepeatingDigits(m[1]),10); type = type || 'ID'; logDebug(`LAST-DIGITS -> type=${type} id=${ident}`); }
    }

    // Pass 4: all digits only -> assume student ID
    if(ident == null){
      const onlyDigits = data.match(/^(\d{1,6})$/);
      if(onlyDigits){ ident = parseInt(deduplicateRepeatingDigits(onlyDigits[1]),10); type = type || 'ID'; logDebug(`ONLY-DIGITS -> type=${type} id=${ident}`); }
    }

    if(!Number.isFinite(ident)) return;

    // Parse optional fields for display name (e.g., Name:John Doe)
    const fields = {};
    data.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line => {
      const mm = line.match(/^([^:;=]+)[:;=](.*)$/);
      if(mm){ fields[mm[1].trim().toUpperCase()] = mm[2].trim(); }
    });
    const scannedNameHint = fields.NAME || '';
    const scannedUidHint = (
      fields.UID
      || ((data.match(/(?:^|\n)\s*UID\s*[:;=]\s*([^\n\r]+)/i) || [])[1] || '')
      || ((raw.match(/UID\.\s*([A-Za-z0-9_-]+)/i) || [])[1] || '')
      || ''
    ).trim();

    if(type === 'ID' && scannedUidHint.toUpperCase().startsWith('ASST')){
      type = 'ASST';
      logDebug(`TYPE CORRECTION -> ASST via UID prefix (${scannedUidHint})`);
    }

    async function resolveAssistantName(aid){
      if(fields.NAME) return fields.NAME;
      try{
        const res = await fetch('/api/assistants/list', {cache:'no-store'});
        const list = await res.json();
        const a = list.find(x=>x.id===aid);
        return a ? a.name : `Staff ${aid}`;
      }catch{ return `Staff ${aid}`; }
    }

    if(type === 'ASST'){
      // Toggle staff on/off duty
      try{
        const res = await fetch(`/api/assistants/select/${ident}`, {method:'POST'});
        const j = await res.json().catch(()=>({}));
        const name = await resolveAssistantName(ident);
        if(!res.ok || j.error){
          showQuickToast(`${name}: ${j.error || 'Toggle failed'}`, true);
          logDebug(`ASST FAIL id=${ident} status=${res.status} body=${JSON.stringify(j)}`);
        } else {
          const action = j.on_duty ? 'On Duty' : 'Off Duty';
          showQuickToast(`${name} — ${action}`);
          logDebug(`ASST OK id=${ident} action=${action}`);
          // Refresh navbar staff list to update checkmark
          if (typeof loadAssistants === 'function') {
            loadAssistants();
          }
        }
        fetchDashboardData({ priority: true });
      }catch(err){
        console.error('[dashboard] staff toggle error', err);
        showQuickToast('Error toggling staff '+ident, true);
        logDebug(`ASST ERROR id=${ident} msg=${err.message}`);
      }
      return; // done
    }

    // Default: treat as student ID
    try{
      const res = await fetch('/api/sessions/toggle',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ student_id: ident, student_name: scannedNameHint, student_uid: scannedUidHint })
      });
      const j = await res.json().catch(()=>({}));
      if(!res.ok){
        console.warn('[dashboard][scan] toggle failed', j);
        const errorMessage = (j && j.error) ? j.error : 'Scan action failed';
        showQuickToast(errorMessage, true);
        logDebug(`TOGGLE FAIL id=${ident} status=${res.status} body=${JSON.stringify(j)}`);
      } else {
        const action = (j && j.action) ? (j.action==='started'?'Started':'Checked Out') : 'Updated';
        if(j && j.action === 'started'){
          applyLocalCheckin(j.student_id || ident, j.name || (`Student ${ident}`));
          showQuickToast(`${j.name||('Student '+ident)} — ${action}`);
        }
        if(j && j.action === 'checked_out'){
          applyLocalCheckout(j.student_id || ident, j.checkout_email_status);
          showQuickToast(`${j.name||('Student '+ident)} — Checked Out`);
        }
        logDebug(`TOGGLE OK id=${ident} action=${action}`);
      }
      fetchDashboardData({ priority: true });
    }catch(err){
      console.error('[dashboard] toggle error', err);
      logDebug(`ERROR id=${ident} msg=${err.message}`);
    }

    // ensure buffers are clear and ready for next scan immediately
    scanBuffer = '';
    lastKeyTs = 0;
  }

  function scheduleFinalize(){
    if (!isActiveClassWindow || !pageIsReadyForScan()) return;
    if(finalizeTimer) clearTimeout(finalizeTimer);
    finalizeTimer = setTimeout(finalizeScan, IDLE_MS);
    if(forceFinalizeTimer) clearTimeout(forceFinalizeTimer);
    forceFinalizeTimer = setTimeout(finalizeScan, FORCE_MS);
  }

  function onKeyDown(e){
    if (!isActiveClassWindow || !pageIsReadyForScan() || redirectInProgress) return;
    // Block disruptive browser shortcuts (downloads/print/save/open/close)
    if (e.ctrlKey) {
      const kk = (e.key || '').toLowerCase();
      if (["j","p","o","s","w"].includes(kk)) {
        e.preventDefault();
        e.stopPropagation();
        logDebug(`BLOCKED Ctrl+${kk.toUpperCase()}`);
        return;
      }
      // Ignore other Ctrl combos
      return;
    }
    // Ignore Alt/Meta
    if(e.altKey || e.metaKey) return;
    const k = e.key;
    if(k === 'Enter'){ e.preventDefault(); finalizeScan(); return; }
    if(k.length === 1){
      const now = Date.now();
      logDebug(`KEY '${k}' buffer_before='${scanBuffer}' dt=${now-lastKeyTs}ms`);
      lastKeyTs = now;
      // If the user is typing in the search field, allow typing but still build the scan buffer
      // Scanner sends fast sequences; human typing won't trigger finalize due to larger gaps
      scanBuffer += k;
      scheduleFinalize();
    }
  }

  // Keep focus on body to avoid losing key events after first scan
  function keepFocus(){
    if(focusTimer) clearTimeout(focusTimer);
    if(document.activeElement && document.activeElement.id === 'dashDebugArea'){
      // don't steal focus if user is copying logs
    } else {
      // attempt to focus body without moving cursor
      if(document.body) document.body.focus({preventScroll:true});
    }
    focusTimer = setTimeout(keepFocus, KEEP_FOCUS_MS);
  }

  function attachListeners(){
    if(listenersAttached) return;
    document.addEventListener('keydown', onKeyDown, {capture:true});
    window.addEventListener('keydown', onKeyDown, {capture:true});
    document.addEventListener('keypress', onKeyDown, {capture:true});
    window.addEventListener('keypress', onKeyDown, {capture:true});
    listenersAttached = true;
    logDebug('Listeners attached (document/window, keydown/keypress, capture=true)');
  }

  function showQuickToast(msg, isError){
    let el = document.getElementById('dashQuickToast');
    if(!el){
      el = document.createElement('div');
      el.id = 'dashQuickToast';
      el.style.position='fixed'; el.style.top='12px'; el.style.right='12px';
      el.style.zIndex='2000'; el.style.minWidth='220px';
      document.body.appendChild(el);
    }
    el.innerHTML = `<div class="alert ${isError?'alert-danger':'alert-success'} shadow-sm py-2 px-3 mb-0">${msg}</div>`;
    setTimeout(()=>{ if(el) el.innerHTML=''; }, 2500);
  }

  // Attach global keydown listener on dashboard
  ensureDebugPanel();
  keepFocus();
  attachListeners();
  window.showQuickToast = showQuickToast;
})();
</script>
